[project]
name = "enterprise-agentic-ai-platform"
version = "0.1.0"
description = "Production-grade multilayer agentic AI platform"
readme = "README.md"
authors = [
    { name = "guptrachit", email = "guptrachit@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
